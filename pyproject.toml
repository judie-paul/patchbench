[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "patchbench"
version = "0.1.0.dev0"
description = "SWE-bench-style runner that evaluates code patches in isolated Docker containers"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["pydantic>=2.8", "typer>=0.12", "pytest>=8"]

[project.scripts]
patchbench = "patchbench.cli:app"

[project.optional-dependencies]
docker = ["docker>=7"]
service = ["fastapi>=0.115", "uvicorn>=0.30", "celery>=5.4", "httpx>=0.27"]
hf = ["huggingface_hub>=0.24", "pyarrow>=15"]
dev = ["pytest-cov>=5", "ruff>=0.9", "mypy>=1.13", "build>=1.2", "twine>=6", "pre-commit>=4"]

[tool.hatch.build.targets.wheel]
packages = ["src/patchbench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --cov=patchbench --cov-report=term-missing --cov-fail-under=85"
markers = [
  "network: needs the network; excluded by default",
  "docker: needs a Docker daemon; excluded by default",
]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["fixtures"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["docker.*", "celery.*", "huggingface_hub.*", "pyarrow.*"]
ignore_missing_imports = true
